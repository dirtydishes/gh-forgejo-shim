# The gateway in server mode, next to a Forgejo that runs in a container.
# See docs/gateway/server-mode.md.
#
# Copy this file to a folder of its own, set the three values marked below, then run
# `docker compose up -d` in that folder. To upgrade, change the image tag and run it again; to roll
# back, change the tag back.
services:
  fga-server:
    # A release from https://github.com/dirtydishes/gh-forgejo-shim/releases. Pin a version, so an
    # upgrade happens only when you change it.
    image: ghcr.io/dirtydishes/fga-server:0.3.1
    container_name: fga-server
    restart: unless-stopped
    environment:
      # 1. How the gateway reaches Forgejo: its address on the shared network.
      FGA_FORGEJO_URL: http://forgejo:3000
      # 2. The forge's own address, as users type it. The gateway answers only this host and port.
      FGA_PUBLIC_URL: https://forge.example.com
      # Match Forgejo's [repository.pull-request] WORK_IN_PROGRESS_PREFIXES if you changed them.
      # FGA_WIP_PREFIXES: "WIP:,[WIP]"
      # One anonymous usage report a day; "0" turns it off. See docs/telemetry.md.
      # FGA_TELEMETRY: "0"
    # Keeps the usage report's first week and last day sent across restarts and upgrades.
    volumes:
      - fga-state:/var/lib/fga-server
    # The network Forgejo and the reverse proxy share, so the proxy reaches the gateway as
    # http://fga-server:8080. With Nginx Proxy Manager, that's NPM's network. No port is published.
    networks: [forge]

volumes:
  fga-state:

networks:
  forge:
    external: true
    # 3. The existing network's name.
    name: forge
