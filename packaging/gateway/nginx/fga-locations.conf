# Include inside the forge's `server { ... }` block, next to the location that proxies Forgejo.
# Define the gateway's address once, outside the server block:
#     upstream fga { server 127.0.0.1:8080; }
# The gateway answers only requests for the forge's own host and port, so pass the client's Host
# as sent: $http_host keeps a non-default port, which $host drops.

location /api/v3/ {
    proxy_pass http://fga;
    proxy_set_header Host $http_host;
}

location = /api/graphql {
    proxy_pass http://fga;
    proxy_set_header Host $http_host;
}

# gh and ChatGPT link pull requests as /{owner}/{repo}/pull/{n}; the gateway redirects them to
# Forgejo's /pulls/{n}.
location ~ ^/[^/]+/[^/]+/pull/[0-9]+(/|$) {
    proxy_pass http://fga;
    proxy_set_header Host $http_host;
}
