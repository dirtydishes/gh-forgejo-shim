# Include inside the forge's `server { ... }` block, next to the location that proxies Forgejo.
# Define the gateway's address once, outside the server block:
#     upstream fga { server 127.0.0.1:8080; }
# The gateway answers only requests for the forge's own host and port, so pass the client's Host
# as sent: $http_host keeps a non-default port, which $host drops. A request line can name its own host
# (`GET https://forge:8443/... HTTP/1.1`); nginx forwards only the path and the Host header, so the
# gateway would never see that host. Each location refuses any request target that isn't a path.

# ^~ stops nginx from trying regex locations for this prefix, such as Nginx Proxy Manager's asset
# cache, which would otherwise take /api/v3/repos/o/site.js away from the gateway.
location ^~ /api/v3/ {
    if ($request !~ "^[A-Z]+ /") { return 400; }
    proxy_pass http://fga;
    proxy_set_header Host $http_host;
}

location = /api/graphql {
    if ($request !~ "^[A-Z]+ /") { return 400; }
    proxy_pass http://fga;
    proxy_set_header Host $http_host;
}

# gh and ChatGPT link pull requests as /{owner}/{repo}/pull/{n}; the gateway redirects them to
# Forgejo's /pulls/{n}.
location ~ ^/[^/]+/[^/]+/pull/[0-9]+(/|$) {
    if ($request !~ "^[A-Z]+ /") { return 400; }
    proxy_pass http://fga;
    proxy_set_header Host $http_host;
}
