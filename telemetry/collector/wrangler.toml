# The usage-report collector (docs/telemetry.md). Placeholder IDs: deploying needs a real D1
# database ID, and the custom domain is attached in the Cloudflare dashboard.
name = "gfj-telemetry"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false

# No request logs, traces or Logpush: the Worker keeps nothing about who sent a report.
logpush = false

[observability]
enabled = false

[observability.logs]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "gfj-telemetry"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Daily: work out and store each finished week's totals, then delete counts past the retention
# period.
[triggers]
crons = ["17 3 * * *"]
