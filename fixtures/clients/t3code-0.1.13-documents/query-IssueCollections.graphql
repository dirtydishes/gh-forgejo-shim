query IssueCollections($owner:String!$name:String!$number:Int!$labelsCursor:String$assigneesCursor:String$closingPullRequestsCursor:String$withLabels:Boolean!$withAssignees:Boolean!$withClosingPullRequests:Boolean!){repository(owner:$owner name:$name){issue(number:$number){labels(first:100 after:$labelsCursor)@include(if:$withLabels){pageInfo{hasNextPage endCursor}nodes{name color}}assignees(first:100 after:$assigneesCursor)@include(if:$withAssignees){pageInfo{hasNextPage endCursor}nodes{login name avatarUrl}}closedByPullRequestsReferences(first:100 after:$closingPullRequestsCursor includeClosedPrs:true)@include(if:$withClosingPullRequests){pageInfo{hasNextPage endCursor}nodes{number title url state isDraft repository{nameWithOwner}}}}}}
