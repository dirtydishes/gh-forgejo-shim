query RepositoryInfo($owner: String!, $name: String!) {
    repository(owner: $owner, name: $name) {archivedAt,assignableUsers(first:100){nodes{id,login,name}},codeOfConduct{key,name,url},contactLinks{about,name,url},createdAt,defaultBranchRef{name},deleteBranchOnMerge,description,diskUsage,forkCount,fundingLinks{platform,url},hasDiscussionsEnabled,hasIssuesEnabled,hasProjectsEnabled,hasWikiEnabled,homepageUrl,id,isArchived,isBlankIssuesEnabled,isEmpty,isFork,isInOrganization,isMirror,isPrivate,isSecurityPolicyEnabled,isTemplate,isUserConfigurationRepository,issueTemplates{name,title,body,about},issues(states:OPEN){totalCount},labels(first:100){nodes{id,color,name,description}},languages(first:100){edges{size,node{name}}},latestRelease{publishedAt,tagName,name,url},licenseInfo{key,name,nickname},mentionableUsers(first:100){nodes{id,login,name}},mergeCommitAllowed,milestones(first:100,states:OPEN){nodes{number,title,description,dueOn}},mirrorUrl,name,nameWithOwner,openGraphImageUrl,owner{id,login},parent{id,name,owner{id,login}},primaryLanguage{name},projects(first:100,states:OPEN){nodes{id,name,number,body,resourcePath}},projectsV2(first:100,query:"is:open"){nodes{id,number,title,resourcePath,closed,url}},pullRequestTemplates{body,filename},pullRequests(states:OPEN){totalCount},pushedAt,rebaseMergeAllowed,repositoryTopics(first:100){nodes{topic{name}}},securityPolicyUrl,squashMergeAllowed,sshUrl,stargazerCount,templateRepository{id,name,owner{id,login}},updatedAt,url,usesCustomOpenGraphImage,viewerCanAdminister,viewerDefaultCommitEmail,viewerDefaultMergeMethod,viewerHasStarred,viewerPermission,viewerPossibleCommitEmails,viewerSubscription,visibility,watchers{totalCount}}
  }
