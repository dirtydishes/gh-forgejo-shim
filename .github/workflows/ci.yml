name: ci

on:
  push:
    branches:
      - main
      - "lavender/**"
      - rewrite
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  contract:
    name: contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Cache cargo build output
        uses: Swatinem/rust-cache@v2

      - name: Compare shim with committed gh oracle
        run: scripts/contract/run.sh

  rust:
    name: rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Cache cargo build output
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --locked

  advisories:
    name: advisories
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      # Fails on any vulnerability advisory against a crate in Cargo.lock, built or not.
      # Unmaintained and unsound notices print as warnings without failing the job.
      - name: Check Cargo.lock against the RustSec advisory database
        run: cargo audit

  gateway-e2e:
    name: gateway e2e
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Run gh against the gateway and a real Forgejo
        run: scripts/e2e.sh

      - name: Run gh and Claude's lookups through the server-mode image and nginx snippet
        run: scripts/e2e-server.sh

      - name: Upload e2e results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-e2e-results
          path: .local/e2e/

  release-package-smoke:
    name: release package smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Build release archive
        run: scripts/package-release.sh

      - name: Verify archive checksum and native entrypoints
        shell: bash
        run: |
          set -euo pipefail

          archive="$(find dist -maxdepth 1 -name 'gh-forgejo-shim-*.tar.gz' -print -quit)"
          checksum="${archive}.sha256"
          checksum_dir="$(dirname "$checksum")"
          checksum_file="$(basename "$checksum")"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$checksum_dir" && sha256sum -c "$checksum_file")
          else
            (cd "$checksum_dir" && shasum -a 256 -c "$checksum_file")
          fi

          mkdir -p dist/smoke-install
          tar -xzf "$archive" -C dist/smoke-install

          dist/smoke-install/gfj --version
          dist/smoke-install/gh-forgejo-shim --help

          set +e
          output="$(dist/smoke-install/gfj doctor 2>&1)"
          status="$?"
          set -e

          printf '%s\n' "$output"
          test "$status" -eq 0 -o "$status" -eq 1
          printf '%s\n' "$output" | grep -F "gh-forgejo-shim doctor"

          real_bin="$(mktemp -d)"
          shim_bin="$(mktemp -d)"
          cat > "$real_bin/gh" <<'EOF'
          #!/usr/bin/env sh
          printf '%s\n' 'gh version 9.9.9 (ci fake)'
          EOF
          chmod +x "$real_bin/gh"

          # Install checks real gh's version (2.103.3 or newer); the runner's own gh may be
          # older, so install against the fake one the wrapper will use below.
          FJ_SHIM_REAL_GH="$real_bin/gh" dist/smoke-install/gfj install-shim --bin-dir "$shim_bin"
          test -x "$shim_bin/gh"
          if grep -Eiq 'python|pipx' "$shim_bin/gh"; then
            sed -n '1,20p' "$shim_bin/gh" >&2
            exit 1
          fi
          test "$(PATH="$shim_bin:$real_bin:$PATH" command -v gh)" = "$shim_bin/gh"
          test "$(PATH="$shim_bin:$real_bin:$PATH" FJ_SHIM_REAL_GH="$real_bin/gh" gh --version)" = "gh version 9.9.9 (ci fake)"

  # The release's gateway image, built for both architectures without pushing, and started once.
  gateway-image:
    name: gateway image ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/gateway/Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: fga-server:ci
          load: true

      - name: Start it and check it answers
        shell: bash
        run: |
          set -euo pipefail
          # A release build reports usage unless told not to; the runner's CI isn't passed in.
          docker run -d --name fga-server -p 127.0.0.1:8080:8080 \
            -e FGA_TELEMETRY=0 \
            -e FGA_FORGEJO_URL=http://127.0.0.1:9 \
            -e FGA_PUBLIC_URL=https://forge.example.com \
            fga-server:ci
          # Without a token the gateway answers 401 before it calls Forgejo.
          for attempt in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: forge.example.com' \
              http://127.0.0.1:8080/api/v3/meta || true)"
            [[ "$code" == 401 ]] && exit 0
            sleep 1
          done
          docker logs fga-server
          echo "expected 401 from /api/v3/meta, got ${code}" >&2
          exit 1

  collector:
    name: telemetry collector
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telemetry/collector

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: telemetry/collector/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      # Miniflare runs the Worker and its D1 database locally; nothing reaches Cloudflare.
      - name: Test
        run: npm test
