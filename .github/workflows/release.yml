name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GATEWAY_IMAGE: ghcr.io/dirtydishes/fga-server
  # The image's page on GitHub shows these, read from the multi-arch index's annotations.
  GATEWAY_DOCS: https://github.com/dirtydishes/gh-forgejo-shim/blob/main/docs/gateway/server-mode.md
  GATEWAY_DESCRIPTION: >-
    For people who run their own Forgejo: serves GitHub's REST and GraphQL APIs on the forge's own
    hostname, so gh, Claude and other GitHub tools work with it. Setup:
    https://github.com/dirtydishes/gh-forgejo-shim/blob/main/docs/gateway/server-mode.md

jobs:
  version:
    name: check version
    runs-on: ubuntu-24.04
    # Reads only: cargo-audit's build scripts run here, so they get no token that can write.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Check the tag names the crate's version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # The archives, the Homebrew formula and the gateway image take the version from Cargo.toml.
          version="$(cargo pkgid -p gh-forgejo-shim | awk -F'[#@]' '{ print $NF }')"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} doesn't match the crate version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Every build waits for this job, so an advisory published since the last CI run stops the
      # release before anything is packaged.
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Check Cargo.lock against the RustSec advisory database
        run: cargo audit

  build-artifacts:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs: version

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds on Ubuntu 22.04: its binaries need glibc 2.34 at most, so they run on
          # Ubuntu 22.04, Debian 12 and RHEL 9 too. Ubuntu 24.04's would need 2.39.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustup target add "${{ matrix.target }}"

      - name: Cache cargo build output
        uses: Swatinem/rust-cache@v2

      - name: Package release archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          archive="$(scripts/package-release.sh "${{ matrix.target }}")"
          checksum="${archive}.sha256"
          {
            echo "archive=${archive}"
            echo "checksum=${checksum}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify checksum and smoke test gfj doctor from archive
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail

          checksum_dir="$(dirname "$CHECKSUM")"
          checksum_file="$(basename "$CHECKSUM")"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$checksum_dir" && sha256sum -c "$checksum_file")
          else
            (cd "$checksum_dir" && shasum -a 256 -c "$checksum_file")
          fi

          smoke_dir="$(mktemp -d)"
          tar -xzf "$ARCHIVE" -C "$smoke_dir"
          "$smoke_dir/gfj" --version

          set +e
          "$smoke_dir/gfj" doctor > "$smoke_dir/doctor.out" 2>&1
          status=$?
          set -e

          cat "$smoke_dir/doctor.out"
          grep -q "gh-forgejo-shim doctor" "$smoke_dir/doctor.out"

          if [[ "$status" -gt 1 ]]; then
            echo "gfj doctor exited with unexpected status ${status}" >&2
            exit "$status"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: gh-forgejo-shim-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error

  publish-release:
    name: publish release
    runs-on: ubuntu-24.04
    needs: build-artifacts
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      # For docs/release-notes.md, which the release takes as its notes.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: gh-forgejo-shim-*
          path: dist
          merge-multiple: true

      - name: Verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for checksum in *.sha256; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum -c "$checksum"
            else
              shasum -a 256 -c "$checksum"
            fi
          done
          cat ./*.sha256 | sort -k2 > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --notes-file docs/release-notes.md \
              --verify-tag
          fi

  # The gateway image for server mode: each architecture builds on its own runner and pushes by
  # digest, then gateway-image-publish tags both as one image.
  gateway-image:
    name: gateway image ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: [version, build-artifacts]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/gateway/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=fga-server
            org.opencontainers.image.url=${{ env.GATEWAY_DOCS }}
            org.opencontainers.image.description=${{ env.GATEWAY_DESCRIPTION }}
          outputs: type=image,name=${{ env.GATEWAY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Save the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: gateway-digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  gateway-image-publish:
    name: publish gateway image
    runs-on: ubuntu-24.04
    needs: [version, gateway-image]
    permissions:
      contents: read
      packages: write
    # One publish per version at a time. Different versions never wait on or cancel each other, and
    # only the newest stable one moves `latest`, so they can't race for it.
    concurrency:
      group: gateway-image-publish-${{ needs.version.outputs.version }}
      cancel-in-progress: false

    steps:
      # For the repository's release tags, which decide whether this version is the newest.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: source

      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          pattern: gateway-digest-*
          path: digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the image for both architectures
        env:
          VERSION: ${{ needs.version.outputs.version }}
        working-directory: digests
        shell: bash
        run: |
          set -euo pipefail
          tags=(-t "${GATEWAY_IMAGE}:${VERSION}")
          # `latest` names the newest stable release: a prerelease such as 0.3.0-rc.1 doesn't move
          # it, and neither does a rerun for an older release.
          newest="$(git -C ../source tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname \
            | grep -v -e '-' | head -n 1)"
          if [[ "$VERSION" != *-* && "$newest" == "v${VERSION}" ]]; then
            tags+=(-t "${GATEWAY_IMAGE}:latest")
          else
            echo "${VERSION} isn't the newest stable release (${newest}); latest stays where it is"
          fi
          sources=()
          for digest in *; do
            sources+=("${GATEWAY_IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            --annotation "index:org.opencontainers.image.title=fga-server" \
            --annotation "index:org.opencontainers.image.url=${GATEWAY_DOCS}" \
            --annotation "index:org.opencontainers.image.description=${GATEWAY_DESCRIPTION}" \
            "${sources[@]}"
          docker buildx imagetools inspect "${GATEWAY_IMAGE}:${VERSION}"
