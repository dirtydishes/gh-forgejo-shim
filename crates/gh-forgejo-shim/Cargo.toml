[package]
name = "gh-forgejo-shim"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
name = "gh_forgejo_shim"
path = "src/lib.rs"

[[bin]]
name = "gh-forgejo-shim"
path = "src/main.rs"

[[bin]]
name = "gfj"
path = "src/bin/gfj.rs"

[[test]]
name = "contract"
path = "../../tests/contract.rs"

[dependencies]
fga-core = { path = "../fga-core", default-features = false }
glob = "0.3"
time = { version = "0.3", features = ["formatting", "parsing"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
ureq = { version = "2.10", default-features = false, features = ["tls"] }
rpassword = "7.3"

[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.3", default-features = false }

[lints]
workspace = true

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
