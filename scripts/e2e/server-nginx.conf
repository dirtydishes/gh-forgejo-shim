# The forge's nginx in the server-mode e2e: Forgejo at /, the gateway through the shipped snippet.
upstream fga { server gateway:8080; }
server {
    listen 443 ssl;
    server_name forge.test;
    ssl_certificate /tls/cert.pem;
    ssl_certificate_key /tls/key.pem;
    # Nginx Proxy Manager's "Cache Assets" location, which a plain prefix location would lose to.
    location ~* ^.*\.(css|js|jpe?g|gif|png|webp|woff|woff2|eot|ttf|svg|ico|css\.map|js\.map)$ {
        proxy_pass http://forgejo:3000;
        proxy_set_header Host $http_host;
    }
    include /etc/nginx/fga-locations.conf;
    location / {
        proxy_pass http://forgejo:3000;
        proxy_set_header Host $http_host;
    }
}
